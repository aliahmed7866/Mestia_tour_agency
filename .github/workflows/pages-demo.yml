name: GitHub Pages demo
on:
  push:
    branches: [main]
    paths: ['pages-demo/**', 'scripts/build-pages-demo.py', 'mestia/data/**', '.github/workflows/pages-demo.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-demo
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python scripts/build-pages-demo.py
      - run: node --test pages-demo/*.test.cjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _pages_site
      - id: deployment
        uses: actions/deploy-pages@v4

