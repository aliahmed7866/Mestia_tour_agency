name: Hosted app checks

on:
  push:
    branches: [main]
    paths: ['sites-app/**', '.github/workflows/sites-app-tests.yml']
  pull_request:
    paths: ['sites-app/**', '.github/workflows/sites-app-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: pnpm build
